name: CI

on:
  push:
  pull_request:

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose profiles
        run: docker compose --profile production --profile certificates config --quiet
      - name: Check deployment shell syntax
        run: sh -n scripts/issue-tls-certificate.sh scripts/renew-tls-certificate.sh deploy/nginx/select-config.sh
      - name: Build and validate Nginx bootstrap configuration
        run: |
          docker build -t latentsig-nginx-config ./deploy/nginx
          docker run --rm -e PUBLIC_DOMAIN=connect.latentsig.com latentsig-nginx-config nginx -t
      - name: Build and validate Nginx TLS configuration
        run: |
          mkdir -p "$RUNNER_TEMP/certificates/live/connect.latentsig.com"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/certificates/live/connect.latentsig.com/privkey.pem" \
            -out "$RUNNER_TEMP/certificates/live/connect.latentsig.com/fullchain.pem" \
            -subj "/CN=connect.latentsig.com"
          docker run --rm -e PUBLIC_DOMAIN=connect.latentsig.com \
            -v "$RUNNER_TEMP/certificates:/etc/letsencrypt:ro" \
            latentsig-nginx-config nginx -t

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: latentsig
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: latentsig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latentsig -d latentsig"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://latentsig:ci-password@localhost:5432/latentsig
      - run: pytest -q
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://latentsig:ci-password@localhost:5432/latentsig
          REDIS_URL: redis://localhost:6379/0
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg://latentsig:ci-password@localhost:5432/latentsig
