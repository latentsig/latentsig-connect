name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate production Compose profiles
        run: docker compose --profile production --profile certificates config --quiet
      - name: Check deployment shell syntax
        run: |
          for script in scripts/backup-postgres.sh scripts/issue-tls-certificate.sh scripts/renew-tls-certificate.sh deploy/nginx/select-config.sh; do
            sh -n "$script"
          done
          for script in deploy/gcp/*.sh; do
            bash -n "$script"
          done
      - name: Check GCP deployment Python
        run: |
          python -m compileall -q deploy/gcp
          python deploy/gcp/test_deploy_archive.py
      - name: Build and validate Nginx bootstrap configuration
        run: |
          docker build -t latentsig-nginx-config ./deploy/nginx
          docker run --rm -e PUBLIC_DOMAIN=connect.latentsig.com latentsig-nginx-config nginx -t
      - name: Build and validate Nginx TLS configuration
        run: |
          mkdir -p "$RUNNER_TEMP/certificates/live/connect.latentsig.com"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/certificates/live/connect.latentsig.com/privkey.pem" \
            -out "$RUNNER_TEMP/certificates/live/connect.latentsig.com/fullchain.pem" \
            -subj "/CN=connect.latentsig.com"
          docker run --rm -e PUBLIC_DOMAIN=connect.latentsig.com \
            --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -v "$RUNNER_TEMP/certificates:/etc/letsencrypt:ro" \
            latentsig-nginx-config nginx -t

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and WebKit
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Start isolated API for browser tests
        working-directory: backend
        env:
          APP_ENV: development
          APP_SECRET: ci-only-browser-test-secret
          DATABASE_URL: sqlite:////tmp/latentsig-connect-browser-e2e.db
          OCR_ENABLED: "false"
          AUTH_RATE_LIMIT_COUNT: "1000"
          LEAD_RATE_LIMIT_COUNT: "1000"
        run: |
          alembic upgrade head
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Run Chromium and mobile Safari browser tests
        working-directory: frontend
        env:
          PLAYWRIGHT_WEBKIT: "1"
        run: npm run test:e2e -- --project=chromium --project=webkit-mobile-safari

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: latentsig
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: latentsig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latentsig -d latentsig"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests ../deploy/gcp
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://latentsig:ci-password@localhost:5432/latentsig
      - run: python -m pytest -q
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://latentsig:ci-password@localhost:5432/latentsig
          LATENTSIG_TEST_POSTGRES_URL: postgresql+psycopg://latentsig:ci-password@localhost:5432/latentsig
          REDIS_URL: redis://localhost:6379/0
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg://latentsig:ci-password@localhost:5432/latentsig
